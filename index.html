<style>
:root{--bg:#fff;--bg2:#F5F6FB;--card:#fff;--text:#0F172A;--muted:#55607A;--line:#E3E6F0;--accent:#4F46E5;--accent2:#2563EB;--accent-text:#4338CA;--soft:#EEF0FF;--shadow:0 10px 30px rgba(30,41,99,.08);--shadow-lg:0 30px 70px rgba(37,53,160,.25);--grad:linear-gradient(135deg,#4F46E5,#2563EB);--nav-bg:rgba(255,255,255,.82);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1020;--bg2:#0F1630;--card:#131B36;--text:#EAEEF9;--muted:#A5AEC6;--line:#232D4F;--accent-text:#A5B4FC;--soft:#1A2347;--shadow:0 10px 30px rgba(0,0,0,.35);--shadow-lg:0 30px 70px rgba(0,0,0,.5);--nav-bg:rgba(11,16,32,.82);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0B1020;--bg2:#0F1630;--card:#131B36;--text:#EAEEF9;--muted:#A5AEC6;--line:#232D4F;--accent-text:#A5B4FC;--soft:#1A2347;--shadow:0 10px 30px rgba(0,0,0,.35);--shadow-lg:0 30px 70px rgba(0,0,0,.5);--nav-bg:rgba(11,16,32,.82);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#fff;padding:10px 14px;border-radius:10px;z-index:100}.skip:focus{left:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.i{width:1.25em;height:1.25em;flex:none;vertical-align:middle}
/* nav */
header{position:sticky;top:0;z-index:50;background:var(--nav-bg);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.08rem;color:var(--text);text-decoration:none;letter-spacing:-.01em;margin-right:auto}
.logo svg{width:32px;height:32px}
nav ul{display:none}
nav.open ul{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:64px;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px 18px;box-shadow:var(--shadow)}
nav a{display:block;padding:12px 4px;color:var(--text);text-decoration:none;font-weight:500}
nav a:hover{color:var(--accent-text)}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 .85rem Inter,system-ui,sans-serif;cursor:pointer}
.ib:hover{border-color:var(--accent)}
.ib .i{width:20px;height:20px}
#menuBtn .x{display:none}nav.open ~ .ctl #menuBtn .x{display:block}nav.open ~ .ctl #menuBtn .m{display:none}
.ctl{display:flex;gap:8px;align-items:center}
@media(min-width:960px){nav ul,nav.open ul{display:flex;flex-direction:row;position:static;background:none;border:0;padding:0;box-shadow:none;gap:6px}nav a{padding:8px 12px;border-radius:10px}#menuBtn{display:none}.bar{gap:24px}.logo{margin-right:0}nav{margin-right:auto}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;border-radius:14px;font-weight:600;font-size:1rem;text-decoration:none;border:1px solid transparent;transition:transform .2s,box-shadow .2s;min-height:48px}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(79,70,229,.35)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(79,70,229,.45)}
.btn-g{background:var(--card);color:var(--text);border-color:var(--line)}
.btn-g:hover{border-color:var(--accent);transform:translateY(-2px)}
/* hero */
.hero{position:relative;overflow:hidden;padding:48px 0 72px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;z-index:0;pointer-events:none}
.hero::before{width:420px;height:420px;background:#4F46E5;top:-140px;right:-100px}
.hero::after{width:360px;height:360px;background:#2563EB;bottom:-160px;left:-120px;opacity:.22}
.hero .wrap{position:relative;z-index:1;display:grid;gap:48px;align-items:center}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--soft);color:var(--accent-text);font-weight:600;font-size:.85rem;margin-bottom:20px}
h1{font-size:clamp(2.2rem,6.2vw,3.9rem);line-height:1.06;letter-spacing:-.035em;font-weight:800}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
:root[data-theme=dark] .grad{background:linear-gradient(135deg,#A5B4FC,#7DB1FF);-webkit-background-clip:text;background-clip:text}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .grad{background:linear-gradient(135deg,#A5B4FC,#7DB1FF);-webkit-background-clip:text;background-clip:text}}
.sub{font-size:clamp(1.05rem,2.4vw,1.25rem);color:var(--muted);margin:22px 0 32px;max-width:36em}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.hv{display:flex;flex-direction:column;align-items:center;gap:14px}
.note{font-size:.82rem;color:var(--muted);text-align:center}
@media(min-width:960px){.hero{padding:80px 0 100px}.hero .wrap{grid-template-columns:1.1fr .9fr}}
/* phone */
.phone{font-size:14px;width:20em;aspect-ratio:9/19;border-radius:3em;padding:.65em;background:#0b0d16;box-shadow:var(--shadow-lg),inset 0 0 0 .12em #2a2f45;position:relative;flex:none}
.screen{height:100%;border-radius:2.4em;background:var(--s-bg);color:var(--s-text);overflow:hidden;padding:1em 1.1em;display:flex;flex-direction:column;gap:.75em;position:relative}
.island{position:absolute;top:.75em;left:50%;transform:translateX(-50%);width:5.6em;height:1.5em;background:#000;border-radius:1em;z-index:2}
.sbar{display:flex;justify-content:space-between;font-size:.72em;font-weight:700;padding:.2em .5em 0}
.ptitle{font-size:1.25em;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:.5em;margin-top:.3em}
.ptitle .i{width:1.1em;height:1.1em;color:var(--s-a1)}
.pc{background:var(--s-card);border-radius:1.3em;padding:.9em 1em;box-shadow:0 .2em .8em rgba(0,0,0,.06)}
.pl{font-size:.7em;color:var(--s-muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pv{font-size:.95em;font-weight:700;margin:.2em 0 .6em}
.track{height:.7em;border-radius:1em;background:var(--s-track);overflow:hidden}
.fill{height:100%;width:59%;border-radius:1em;background:linear-gradient(90deg,var(--s-a1),var(--s-a2))}
.pm{font-size:.72em;color:var(--s-muted);margin-top:.6em}
.ringc{text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em}
.ring{width:8em;height:8em;position:relative}
.ring svg{width:100%;height:100%}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.7em;font-weight:800}
.pbtn{margin-top:auto;border-radius:1.1em;padding:.95em;text-align:center;font-weight:700;font-size:.95em;color:#fff;background:linear-gradient(135deg,var(--s-a1),var(--s-a2))}
.sk-classic{--s-bg:#F2F4FB;--s-card:#fff;--s-text:#0F172A;--s-muted:#5B6478;--s-track:#E4E8F5;--s-a1:#4F46E5;--s-a2:#2563EB}
.sk-sunset{--s-bg:#FFF3EA;--s-card:#fff;--s-text:#3B1D12;--s-muted:#8A5A48;--s-track:#FBE0D0;--s-a1:#F97316;--s-a2:#DB2777}
.sk-forest{--s-bg:#0E1D16;--s-card:#162B21;--s-text:#E6F5EC;--s-muted:#9CBFAB;--s-track:#244636;--s-a1:#34D399;--s-a2:#0EA5A4}
.sk-forest .pbtn{color:#04120B}
/* sections */
section{padding:72px 0}
.alt{background:var(--bg2)}
.eyebrow{color:var(--accent-text);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
h2{font-size:clamp(1.7rem,4.2vw,2.6rem);line-height:1.15;letter-spacing:-.025em;font-weight:800;max-width:20em}
.lead{color:var(--muted);font-size:1.08rem;margin-top:14px;max-width:40em}
.sh{margin-bottom:40px}
/* strip */
.strip{padding:0 0 24px;margin-top:-8px}
.strip ul{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.strip li{display:flex;gap:12px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.strip strong{display:block;font-size:.95rem;line-height:1.25}
.strip span.d{font-size:.8rem;color:var(--muted);line-height:1.3;display:block}
.ico{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;flex:none}
.ico .i{width:22px;height:22px}
@media(min-width:900px){.strip ul{grid-template-columns:repeat(4,1fr)}}
/* cards */
.grp{margin-top:36px}.grp:first-of-type{margin-top:0}
.grp h3{font-size:1.1rem;margin-bottom:16px;color:var(--accent-text);letter-spacing:-.01em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card h4{margin:16px 0 6px;font-size:1.05rem;letter-spacing:-.01em}
.card p{color:var(--muted);font-size:.95rem}
/* steps */
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);counter-increment:s}
.steps li::before{content:counter(s);display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;margin-bottom:16px}
.steps h3{font-size:1.08rem;margin-bottom:6px}.steps p{color:var(--muted);font-size:.95rem}
/* themes */
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:36px 20px;justify-items:center}
.themes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:18px}
.themes .phone{font-size:12px}
.themes figcaption{font-weight:700}
/* privacy */
.two{display:grid;gap:36px;align-items:start}
@media(min-width:900px){.two{grid-template-columns:1fr 1fr;gap:56px}}
.checks{display:grid;gap:14px}
.checks li{display:flex;gap:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.checks .ico{width:40px;height:40px;border-radius:12px}
.checks h3{font-size:1rem;margin-bottom:2px}.checks p{color:var(--muted);font-size:.93rem}
/* install */
.ins{display:grid;gap:20px}
@media(min-width:800px){.ins{grid-template-columns:1fr 1fr}}
.ibox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.ibox h3{font-size:1.2rem;margin-bottom:18px}
.ibox ol{counter-reset:n;display:grid;gap:14px}
.ibox li{counter-increment:n;display:flex;gap:14px;color:var(--muted)}
.ibox li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent-text);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ibox li b{color:var(--text)}
.irepo{margin-top:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.irepo p{color:var(--muted);font-size:.95rem;max-width:34em}
/* know */
.know{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.know li{padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent)}
.know h3{font-size:1.02rem;margin-bottom:6px}.know p{color:var(--muted);font-size:.95rem}
/* faq */
.faq{max-width:820px;display:grid;gap:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
details[open]{border-color:var(--accent)}
summary{cursor:pointer;list-style:none;padding:18px 20px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:56px}
summary::-webkit-details-marker{display:none}
summary .i{transition:transform .25s;color:var(--accent-text)}
details[open] summary .i{transform:rotate(180deg)}
details p{padding:0 20px 20px;color:var(--muted)}
/* footer */
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;align-items:center}
footer b{color:var(--text)}
/* reveal */
.js .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.js .reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}.js .reveal{opacity:1;transform:none}}
noscript p{padding:12px 20px;background:var(--soft);text-align:center}
</style>
</head>

var io=null,first=true;
if('IntersectionObserver' in window){io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});}
function reveal(root){$$('.reveal',root).forEach(function(el){if(el.classList.contains('in'))return;if(io&&first)io.observe(el);else el.classList.add('in')})}

function render(){
 var t=D[lang];
 document.documentElement.lang=lang;document.title=t.title;
 $$('[data-i]').forEach(function(el){var v=t[el.getAttribute('data-i')];if(v!==undefined)el.textContent=v});
 $$('[data-gh]').forEach(function(a){a.href=REPO});
 var lb=$('#langBtn');lb.textContent=t.lang_btn;lb.setAttribute('aria-label',t.lang_aria);lb.setAttribute('lang',lang==='pl'?'en':'pl');
 $('#themeBtn').setAttribute('aria-label',t.theme_aria);$('#menuBtn').setAttribute('aria-label',t.menu_aria);
 /* pasek atutów */
 var si=['cloudoff','image','layers','gift'];
 $('#strip').innerHTML=t.strip.map(function(s,i){return '<li class="reveal"><span class="ico">'+ico(si[i])+'</span><span><strong>'+s[0]+'</strong><span class="d">'+s[1]+'</span></span></li>'}).join('');
 /* funkcje */
 var F=[[0,'layers'],[0,'image'],[0,'download'],[0,'check'],[1,'folder'],[1,'filter'],[1,'file'],[1,'drive'],[2,'lock'],[2,'battery'],[2,'file'],[3,'pause'],[3,'retry'],[3,'bell'],[3,'clock'],[3,'palette']];
 $('#featList').innerHTML=t.groups.map(function(g,gi){
  var cards=F.map(function(f,i){return f[0]===gi?'<article class="card reveal"><span class="ico">'+ico(f[1])+'</span><h4>'+t.feat[i][0]+'</h4><p>'+t.feat[i][1]+'</p></article>':''}).join('');
  return '<div class="grp"><h3 class="reveal">'+g+'</h3><div class="grid">'+cards+'</div></div>'}).join('');
 $('#steps').innerHTML=t.steps.map(function(s){return '<li class="reveal"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></li>'}).join('');
 var sk=['classic','sunset','forest'];
 $('#themeList').innerHTML=sk.map(function(k,i){return '<figure class="reveal">'+phone(k)+'<figcaption>'+t.th_names[i]+'</figcaption></figure>'}).join('');
 var pi=['shield','drive','code','file','lock'];
 $('#priv').innerHTML=t.priv.map(function(p,i){return '<li class="reveal"><span class="ico">'+ico(pi[i])+'</span><div><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div></li>'}).join('');
 $('#winList').innerHTML=t.win.map(function(s){return '<li><span>'+s+'</span></li>'}).join('');
 $('#macList').innerHTML=t.mac.map(function(s){return '<li><span>'+s+'</span></li>'}).join('');
 $('#knowList').innerHTML=t.know.map(function(k){return '<li class="reveal"><h3>'+k[0]+'</h3><p>'+k[1]+'</p></li>'}).join('');
 $('#faqList').innerHTML=t.faq.map(function(q){return '<details class="reveal"><summary>'+q[0]+ico('chev')+'</summary><p>'+q[1]+'</p></details>'}).join('');
 /* zawartość mockupów generowana wyżej – uzupełnij teksty */
 $$('[data-i]').forEach(function(el){var v=t[el.getAttribute('data-i')];if(v!==undefined)el.textContent=v});
 reveal(document);first=false;
}

/* akordeon: otwarcie jednego zamyka pozostałe */
document.addEventListener('toggle',function(e){var d=e.target;if(d.tagName==='DETAILS'&&d.open){$$('#faqList details').forEach(function(o){if(o!==d)o.open=false})}},true);

/* motyw */
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function isDark(){var a=document.documentElement.getAttribute('data-theme');return a?a==='dark':!!(mq&&mq.matches)}
function themeIcon(){$('#themeUse').setAttribute('href',isDark()?'#i-sun':'#i-moon')}
$('#themeBtn').addEventListener('click',function(){var n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);store('ub-theme',n);themeIcon()});
if(mq&&mq.addEventListener)mq.addEventListener('change',themeIcon);
$('#langBtn').addEventListener('click',function(){lang=lang==='pl'?'en':'pl';store('ub-lang',lang);render()});
var nav=$('#nav'),mb=$('#menuBtn');
mb.addEventListener('click',function(){var o=nav.classList.toggle('open');mb.setAttribute('aria-expanded',o)});
$$('#nav a').forEach(function(a){a.addEventListener('click',function(){nav.classList.remove('open');mb.setAttribute('aria-expanded','false')})});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&nav.classList.contains('open')){nav.classList.remove('open');mb.setAttribute('aria-expanded','false');mb.focus()}});
$('#yr').textContent=new Date().getFullYear();
themeIcon();render();
})();
</script>
</body>
