name: USBPhotoBackup

options:
  bundleIdPrefix: pl.moja
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  USBPhotoBackup:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: USB Backup
        NSPhotoLibraryUsageDescription: Aplikacja odczytuje zdjęcia i filmy, aby zrobić ich kopię na dysku zewnętrznym.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.moja.usbphotobackup
        TARGETED_DEVICE_FAMILY: "1"
